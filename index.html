<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A modular day planner built around reusable day templates." />
    <meta name="theme-color" content="#121417" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dienius" />
    <title>Dienius</title>
    <script id="pre-paint-theme">
      // Writes the resolved theme's whole token block onto :root before
      // React mounts, so a person with Sketchbook dark saved does not see
      // a frame of plain light Slate on load. App.tsx does the exact same
      // resolve-and-apply once it has loaded through the normal store path
      // (src/lib/theme.ts's resolveTheme + applyResolvedTheme) - this only
      // needs to get there first, not replace that.
      //
      // Before theming had presets, this only had to duplicate one string
      // field. Now it duplicates real weight: the storage key, the preset
      // token data from src/lib/themes.ts, and the resolution algorithm
      // from src/lib/theme.ts. Kept to exactly this much on purpose, and
      // kept loud - every section below is labeled with what it mirrors, so
      // a change on one side is easy to spot as missing on the other.
      // src/preTheme.test.ts runs this exact script text against the real
      // loadData() + resolveTheme() + applyResolvedTheme() for every preset,
      // every mode, and several corrupt-storage cases, and fails on any
      // difference between the two - that test is what actually keeps this
      // honest, not the comment.
      //
      // Wrapped in try/catch throughout because storage can be unavailable
      // (private browsing, a disabled setting), hold something that is not
      // the JSON this expects, or matchMedia can be missing - none of that
      // may ever block the page from rendering. Falling through to no-op
      // leaves :root exactly at the CSS defaults in styles.css, which are
      // Slate light - the same default a fresh install resolves to anyway.
      try {
        // Mirrors STORAGE_KEY in src/lib/storage.ts.
        var STORAGE_KEY = 'dienius:data'
        // Mirrors DEFAULT_PRESET_ID in src/lib/themes.ts.
        var DEFAULT_PRESET_ID = 'dark'
        // Mirrors SYSTEM_LIGHT_PRESET_ID in src/lib/themes.ts.
        var SYSTEM_LIGHT_PRESET_ID = 'light'

        // Mirrors the system font stacks in src/lib/themes.ts. No webfont
        // is bundled in this phase - see that file's own comment. No
        // script, handwritten, or novelty face anywhere - see the same file
        // for why: it costs legibility for someone who reads every screen
        // with an ADHD brain, and a theme's personality belongs to the
        // surface and palette, not the type.
        var SYSTEM_SANS = "-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        var SYSTEM_MONO = "'SF Mono', 'Cascadia Code', Consolas, 'Roboto Mono', monospace"

        // Mirrors PRESETS in src/lib/themes.ts, token for token, as the same
        // array-of-ids shape rather than an object keyed by id. That match
        // matters, not just for consistency: an object keyed by an
        // attacker-controlled presetId (say 'constructor') returns a real,
        // truthy inherited value from Object.prototype instead of undefined,
        // which is exactly the flash-then-revert bug this whole script
        // exists to prevent. An array searched by id, the same way
        // PRESETS.find(p => p.id === id) works in themes.ts, cannot be
        // fooled that way - there is no property lookup for a poisoned key
        // to hit.
        var PRESETS = [
          {
            id: 'dark',
            modes: ['dark'],
            dark: { ruleStyle: 'none', tokens: {
              bg: '#121417', surface: '#1a1d21', surfaceRaised: '#23272c',
              rule: '#00000000', ruleSize: '28px', grain: '0', vignette: '0%',
              border: '#2a2d31', margin: '#00000000',
              text: '#e2e2e0', muted: '#a3a5a6', faint: '#8a8e91',
              accent: '#8aa4f2', accentDim: '#38406a',
              mark: '#d9b15f', danger: '#d99191', good: '#85be92',
              fontDisplay: SYSTEM_SANS, fontBody: SYSTEM_SANS, fontMono: SYSTEM_MONO,
              radius: '10px', edge: '12px', shadow: '0 1px 3px rgba(0, 0, 0, 0.45)',
            } },
          },
          {
            id: 'light',
            modes: ['light'],
            light: { ruleStyle: 'none', tokens: {
              bg: '#f6f5f2', surface: '#ffffff', surfaceRaised: '#ffffff',
              rule: '#00000000', ruleSize: '28px', grain: '0', vignette: '0%',
              border: '#e6e4df', margin: '#00000000',
              text: '#2a2d31', muted: '#6b7075', faint: '#6d7175',
              accent: '#4666e0', accentDim: '#c7d0f7',
              mark: '#efc14e', danger: '#bc4b47', good: '#4e9663',
              fontDisplay: SYSTEM_SANS, fontBody: SYSTEM_SANS, fontMono: SYSTEM_MONO,
              radius: '10px', edge: '12px',
              shadow: '0 1px 2px rgba(0, 0, 0, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04)',
            } },
          },
          {
            id: 'midnight',
            modes: ['dark'],
            dark: { ruleStyle: 'none', tokens: {
              bg: '#0b0c0f', surface: '#14161a', surfaceRaised: '#1d2025',
              rule: '#00000000', ruleSize: '28px', grain: '0', vignette: '0%',
              border: '#212429', margin: '#00000000',
              text: '#e0e1e2', muted: '#9ea1a4', faint: '#82868a',
              accent: '#7fa0f0', accentDim: '#2e3760',
              mark: '#d4ac5c', danger: '#d68c8c', good: '#7fba8c',
              fontDisplay: SYSTEM_SANS, fontBody: SYSTEM_SANS, fontMono: SYSTEM_MONO,
              radius: '10px', edge: '12px', shadow: '0 1px 3px rgba(0, 0, 0, 0.6)',
            } },
          },
        ]

        // Mirrors findPreset in src/lib/themes.ts exactly: a linear search
        // by id, falling back to the first (Dark) entry for an id that
        // does not match any real preset - immune by construction to the
        // Object.prototype collision a keyed-object lookup is vulnerable to.
        function findPresetById(id) {
          for (var i = 0; i < PRESETS.length; i++) {
            if (PRESETS[i].id === id) return PRESETS[i]
          }
          return PRESETS[0]
        }

        // True only if key is an own property of obj - never a name obj
        // merely inherits from Object.prototype ('constructor', 'toString',
        // 'valueOf', 'hasOwnProperty' and the like). Plain bracket access
        // like obj[key] does not make that distinction and will happily
        // return Object.prototype's own real value for those names, which
        // is exactly how the PRESETS lookup above used to break - guarding
        // every other attacker-string-keyed lookup in this script with this
        // closes the same class of bug everywhere it could still hide.
        function hasOwn(obj, key) {
          return Object.prototype.hasOwnProperty.call(obj, key)
        }

        // Mirrors CSS_VAR_NAMES in src/lib/theme.ts.
        var CSS_VAR_NAMES = {
          bg: '--bg', surface: '--surface', surfaceRaised: '--surface-raised',
          rule: '--rule', ruleSize: '--rule-size',
          grain: '--grain', vignette: '--vignette', border: '--border', margin: '--margin',
          text: '--text', muted: '--muted', faint: '--faint', accent: '--accent', accentDim: '--accent-dim',
          mark: '--mark', danger: '--danger', good: '--good',
          fontDisplay: '--font-display', fontBody: '--font-body', fontMono: '--font-mono',
          radius: '--radius', edge: '--edge', shadow: '--shadow',
        }

        // Mirrors isLegacyTheme + migrateTheme in src/lib/storage.ts.
        function migrateTheme(theme) {
          if (theme === 'light' || theme === 'dark') {
            return { presetId: DEFAULT_PRESET_ID, overrides: {}, mode: theme }
          }
          return theme
        }

        // Mirrors isColor, isDimensionList, isUnitInterval, isPercent,
        // isFontStack, isShadow and isOverrideValue in src/lib/storage.ts.
        // A backup with a color set to a CSS url() value fires a real
        // network request the moment it is painted - verified live, see
        // that file's own comment on this security fix for the full
        // reasoning. isValidThemeState below used to accept any string
        // here, which meant this script would still have painted a
        // malicious value straight onto :root before React ever mounted,
        // and kept doing so on every single page load, even after
        // loadData() started rejecting the exact same payload - this
        // script reads storage directly and shares nothing with that
        // module's own validator unless it is kept in step by hand.
        // src/preTheme.test.ts's own url()-value tests are what actually
        // keep this honest.
        var HEX_COLOR_RE = /^#(?:[0-9a-fA-F]{3}|[0-9a-fA-F]{4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/
        var COLOR_TOKEN_KEYS = { bg: 1, surface: 1, surfaceRaised: 1, rule: 1, border: 1, margin: 1, text: 1, muted: 1, faint: 1, accent: 1, accentDim: 1, mark: 1, danger: 1, good: 1 }
        var DIMENSION_TOKEN_KEYS = { ruleSize: 1, radius: 1, edge: 1 }
        var FONT_TOKEN_KEYS = { fontDisplay: 1, fontBody: 1, fontMono: 1 }
        var DIMENSION_PART_RE = /^-?\d+(?:\.\d+)?(?:px|em|rem|%)$/
        function isDimensionList(v) {
          if (typeof v !== 'string' || v.length === 0 || v.length > 100) return false
          var parts = v.split(/[\s/]+/)
          for (var i = 0; i < parts.length; i++) {
            if (!DIMENSION_PART_RE.test(parts[i])) return false
          }
          return true
        }
        function isUnitInterval(v) {
          return typeof v === 'string' && /^(?:0|1|0?\.\d+)$/.test(v)
        }
        function isPercent(v) {
          return typeof v === 'string' && /^\d+(?:\.\d+)?%$/.test(v)
        }
        function isFontStack(v) {
          return typeof v === 'string' && v.length > 0 && v.length <= 200 && /^[a-zA-Z0-9 ,'-]+$/.test(v)
        }
        var SHADOW_FUNCTION_RE = /\b(?:rgba|rgb|hsla|hsl)\([\d.\s,%]*\)/gi
        function isShadow(v) {
          if (typeof v !== 'string' || v.length === 0 || v.length > 300) return false
          var withoutFunctions = v.replace(SHADOW_FUNCTION_RE, '')
          return !/[(){}]/.test(withoutFunctions) && /^[\d.,#a-zA-Z%\s-]*$/.test(withoutFunctions)
        }
        function isValidOverrideValue(key, value) {
          if (hasOwn(COLOR_TOKEN_KEYS, key)) return typeof value === 'string' && HEX_COLOR_RE.test(value)
          if (hasOwn(DIMENSION_TOKEN_KEYS, key)) return isDimensionList(value)
          if (key === 'grain') return isUnitInterval(value)
          if (key === 'vignette') return isPercent(value)
          if (hasOwn(FONT_TOKEN_KEYS, key)) return isFontStack(value)
          if (key === 'shadow') return isShadow(value)
          return typeof value === 'string' && value.length <= 200
        }

        // Mirrors isThemeState in src/lib/storage.ts, closely enough to
        // reject the same malformed shapes it does.
        function isValidThemeState(t) {
          if (!t || typeof t !== 'object') return false
          if (typeof t.presetId !== 'string') return false
          if (!t.overrides || typeof t.overrides !== 'object') return false
          for (var presetId in t.overrides) {
            var patch = t.overrides[presetId]
            if (!patch || typeof patch !== 'object') return false
            for (var token in patch) {
              if (!isValidOverrideValue(token, patch[token])) return false
            }
          }
          return t.mode === 'light' || t.mode === 'dark' || t.mode === 'system'
        }

        var DEFAULT_THEME_STATE = { presetId: DEFAULT_PRESET_ID, overrides: {}, mode: 'system' }

        // Mirrors salvageTheme in src/lib/storage.ts: reads settings.theme
        // out of a payload that may otherwise be entirely invalid, without
        // requiring anything else in it to be valid - see that function's
        // own comment for why. Always returns a usable ThemeState, falling
        // back to a fresh install's own default on any failure - unparsable
        // JSON included - rather than letting that failure skip resolution
        // and applying entirely. A person with a corrupt payload still gets
        // a fully painted default room, not a page left to the static CSS
        // fallback alone.
        function readThemeState() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY)
            if (!raw) return DEFAULT_THEME_STATE
            var parsed = JSON.parse(raw)
            var theme = parsed && typeof parsed === 'object' ? parsed.settings && parsed.settings.theme : undefined
            if (theme === 'light' || theme === 'dark' || isValidThemeState(theme)) {
              return migrateTheme(theme)
            }
            return DEFAULT_THEME_STATE
          } catch (e) {
            return DEFAULT_THEME_STATE
          }
        }

        // Mirrors systemPrefersDark in src/lib/theme.ts.
        function systemPrefersDark() {
          try {
            return window.matchMedia('(prefers-color-scheme: dark)').matches
          } catch (e) {
            return false
          }
        }

        // Mirrors resolveTheme's mode fallback in src/lib/theme.ts: the
        // requested mode if the preset actually ships it, otherwise
        // whichever mode it does ship.
        function resolveMode(requested, availableModes) {
          for (var i = 0; i < availableModes.length; i++) {
            if (availableModes[i] === requested) return requested
          }
          return availableModes[0]
        }

        // Mirrors ruleAxisColors in src/lib/theme.ts.
        function ruleAxisColors(rule, ruleStyle) {
          return {
            ruleH: ruleStyle === 'none' ? 'transparent' : rule,
            ruleV: ruleStyle === 'squares' ? rule : 'transparent',
          }
        }

        // Mirrors relativeLuminance + contrastRatio + bestInk in
        // src/lib/contrast.ts, just enough to derive --safe-ink before
        // React mounts - see applyResolvedTheme in src/lib/theme.ts for why
        // this exists and why it reads --surface, never --text.
        function linearizeChannel(c) {
          var p = c / 255
          return p <= 0.03928 ? p / 12.92 : Math.pow((p + 0.055) / 1.055, 2.4)
        }
        function relativeLuminance(hex) {
          var h = hex.replace('#', '')
          var r = parseInt(h.slice(0, 2), 16)
          var g = parseInt(h.slice(2, 4), 16)
          var b = parseInt(h.slice(4, 6), 16)
          return 0.2126 * linearizeChannel(r) + 0.7152 * linearizeChannel(g) + 0.0722 * linearizeChannel(b)
        }
        function contrastRatio(hexA, hexB) {
          var a = relativeLuminance(hexA)
          var b = relativeLuminance(hexB)
          var lighter = Math.max(a, b)
          var darker = Math.min(a, b)
          return (lighter + 0.05) / (darker + 0.05)
        }
        function bestInk(background) {
          return contrastRatio('#000000', background) >= contrastRatio('#ffffff', background) ? '#000000' : '#ffffff'
        }

        var themeState = readThemeState()
        // findPresetById resolves an unknown presetId to Slate by linear
        // search, same as findPreset in src/lib/themes.ts - see that
        // function's own comment above for why this is not a plain
        // object-keyed lookup. The override patch below is then looked up
        // by that same resolved id - the id actually rendered - not
        // whatever unknown id was originally asked for, and guarded with
        // hasOwn since overrides, unlike PRESETS, is a real dictionary
        // keyed by arbitrary preset ids and cannot be swapped for an array.
        // Mirrors presetFor in src/lib/theme.ts. Every theme is single-mode
        // now, so "follow the system" acts on which theme is rendered rather
        // than on a mode within one - and only ever overrides toward light,
        // so somebody who picked Midnight for their screen keeps it at night.
        var preset = findPresetById(themeState.presetId)
        if (themeState.mode === 'system') {
          if (systemPrefersDark()) {
            if (preset.modes.indexOf('dark') === -1) preset = findPresetById(DEFAULT_PRESET_ID)
          } else if (preset.modes.indexOf('light') === -1) {
            preset = findPresetById(SYSTEM_LIGHT_PRESET_ID)
          }
        }
        var presetId = preset.id
        var requestedMode = themeState.mode === 'system' ? (systemPrefersDark() ? 'dark' : 'light') : themeState.mode
        var mode = resolveMode(requestedMode, preset.modes)
        var variant = mode === 'dark' ? preset.dark : preset.light
        var patch = hasOwn(themeState.overrides, presetId) ? themeState.overrides[presetId] : {}

        var root = document.documentElement
        for (var key in CSS_VAR_NAMES) {
          var value = typeof patch[key] === 'string' && patch[key].length > 0 ? patch[key] : variant.tokens[key]
          root.style.setProperty(CSS_VAR_NAMES[key], value)
        }
        var ruleStyle = patch.ruleStyle === 'none' || patch.ruleStyle === 'lines' || patch.ruleStyle === 'squares'
          ? patch.ruleStyle
          : variant.ruleStyle
        // An overridden rule color must feed the axis derivation too.
        var ruleColor = typeof patch.rule === 'string' && patch.rule.length > 0 ? patch.rule : variant.tokens.rule
        var axisColors = ruleAxisColors(ruleColor, ruleStyle)
        root.style.setProperty('--rule-h', axisColors.ruleH)
        root.style.setProperty('--rule-v', axisColors.ruleV)
        // Derived from whatever --surface the loop above just wrote - never
        // from --text, which is the one token an override can turn into the
        // exact problem this exists to keep an escape route out of.
        root.style.setProperty('--safe-ink', bestInk(root.style.getPropertyValue('--surface')))
        // Mirrors applyResolvedTheme's own --on-accent, for the same reason
        // every other line here mirrors it: the first paint has to agree
        // with what React writes a moment later. preTheme.test.ts is what
        // keeps the two honest.
        root.style.setProperty('--on-accent', bestInk(root.style.getPropertyValue('--accent')))
        root.style.setProperty('--on-danger', bestInk(root.style.getPropertyValue('--danger')))
        root.dataset.theme = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A modular day planner built around reusable day templates." />
    <meta name="theme-color" content="#fafaf8" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dienius" />
    <title>Dienius</title>
    <script>
      // Sets the theme before React mounts, so a dark-mode user does not see
      // a frame of the light theme on load. App.tsx applies the same theme
      // to document.documentElement.dataset.theme in a useEffect once it
      // has loaded through the normal store path - this only needs to get
      // there first, not replace that.
      //
      // This duplicates two things from src/lib/storage.ts on purpose,
      // kept to exactly this much: the storage key ('dienius:data') and the
      // shape of the one field this needs (settings.theme). If either ever
      // changes, this must change with it. Wrapped in try/catch because
      // storage can be unavailable (private browsing, a disabled setting)
      // or hold something that is not the JSON this expects, and neither
      // should ever be able to block the page from rendering - light is
      // the same default defaultData() in storage.ts already uses, so
      // falling through to it here is not a guess.
      try {
        var raw = localStorage.getItem('dienius:data')
        if (raw && JSON.parse(raw).settings.theme === 'dark') {
          document.documentElement.dataset.theme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

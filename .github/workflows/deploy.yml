name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per branch/PR rather than one shared "pages" group, now that
  # pull requests run this workflow too - a PR build should only ever
  # cancel an earlier run of the same PR, never race against or cancel the
  # deploy pipeline running for main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    # Tests and build run on every pull request too (see the trigger above) -
    # this is the one job that must not: a PR from an untrusted fork should
    # never be able to push to GitHub Pages, and deploying unmerged code
    # would defeat the point of review happening on the PR at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

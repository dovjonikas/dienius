name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per branch/PR rather than one shared "pages" group, now that
  # pull requests run this workflow too - a PR build should only ever
  # cancel an earlier run of the same PR, never race against or cancel the
  # deploy pipeline running for main.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The browser tests, in their own job: the deploy waits for the unit suite
  # and the build above, never for this. A flake here must not hold a
  # release; a real failure shows red where it can be read.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser first, on its own. Playwright downloads its own chromium
      # build from its own CDN and this step touches no package manager at
      # all - so nothing about it can be broken by a repository this project
      # does not use.
      - run: npx playwright install chromium
      # Then the OS libraries that browser needs, which is what --with-deps
      # is for. It runs `apt-get update` across *every* repo on the runner,
      # and on 2026-09-09 Google's Chrome repo served a Packages.gz whose
      # hash did not match its own Release file - so apt exited 100, this job
      # went red three runs in a row, and none of it had anything to do with
      # the app or with a browser we get from Google in the first place.
      #
      # continue-on-error, not removed: the runner image already ships these
      # libraries, so this is a belt whose braces are the image itself. If it
      # is genuinely needed one day and genuinely fails, the run below says so
      # in a way somebody can read, rather than an apt error about a mirror.
      - run: npx playwright install-deps chromium
        continue-on-error: true
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    needs: build
    # Tests and build run on every pull request too (see the trigger above) -
    # this is the one job that must not: a PR from an untrusted fork should
    # never be able to push to GitHub Pages, and deploying unmerged code
    # would defeat the point of review happening on the PR at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
